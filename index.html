<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#161616;--m:#74746e;--line:#e5e4df;--acc:#f26b1d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1c1c1b;--ink:#f3f2ee;--m:#9b9a93;--line:#2d2d2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--card:#1c1c1b;--ink:#f3f2ee;--m:#9b9a93;--line:#2d2d2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,.logo{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
h1{font-size:28px;margin:12px 0 4px}h2{font-size:20px;margin:28px 0 10px}
.m{color:var(--m)}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px}
.logo{font-size:28px;cursor:pointer}.logo i{color:var(--acc);font-style:normal}
button,input,select,textarea{font:inherit;color:inherit}
.ib{background:none;border:0;cursor:pointer;padding:8px;border-radius:50%;color:var(--m);display:flex;width:max-content}
.ib:hover{color:var(--ink)}header .ib:first-child{justify-self:start}
main{max-width:900px;margin:0 auto;padding:4px 20px 60px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:10px 20px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.o{background:var(--acc);color:#fff}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
main input:not([type=checkbox]),select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;font-size:13px;color:var(--m);margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:30px auto}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;cursor:pointer}
.tile:hover{border-color:var(--acc)}.tile svg{color:var(--acc)}
.tile b{display:block;font-size:17px;margin-top:12px;font-weight:500}.tile span{color:var(--m);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:560px;margin:20px auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}.bar input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px}
.bk{cursor:pointer}.bk b{display:block;font-weight:500;margin-top:10px}.bk small{color:var(--m)}
.cv{aspect-ratio:3/4;border-radius:4px 10px 10px 4px;padding:16px 14px;color:#fff;display:flex;align-items:flex-end;background-size:cover;background-position:center;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.14);font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.35);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.ed{display:grid;grid-template-columns:200px 1fr;gap:32px;margin-top:16px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--bg);box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}.sw i.on{outline:2px solid var(--ink)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:16px;padding:28px;text-align:center;cursor:pointer;color:var(--m);margin:0}
.drop:hover{border-color:var(--acc)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;margin:16px 0}
.tb{position:relative}.tb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.tb button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.stage{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px}
.book{display:flex;justify-content:center;perspective:1400px;flex:1;max-width:820px;touch-action:pan-y}
.pg{flex:1 1 0;max-width:410px;aspect-ratio:3/4;background:#fff;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.pg img{width:100%;height:100%;object-fit:contain;display:block;user-select:none}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none}
.pg.l{border-radius:8px 0 0 8px;transform-origin:right}.pg.l::after{background:linear-gradient(to left,rgba(0,0,0,.2),transparent 14%)}
.pg.r{border-radius:0 8px 8px 0;transform-origin:left}.pg.r::after{background:linear-gradient(to right,rgba(0,0,0,.2),transparent 14%)}
.fl{animation:fl .4s ease}.fl.r{--d:-70deg}.fl.l{--d:70deg}
@keyframes fl{from{transform:rotateY(var(--d));opacity:.4}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.nx svg{transform:scaleX(-1)}.pn{text-align:center;color:var(--m);margin-top:14px}
#ms{height:340px;overflow:auto;margin:16px 0 0;max-width:none;padding:14px}
.msg{background:var(--bg);border-radius:14px;padding:8px 12px;margin:6px 0;width:fit-content;max-width:80%}
.msg.me{background:var(--acc);color:#fff;margin-left:auto}.msg small{display:block;opacity:.7;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0 0;overflow-x:auto;max-width:560px;margin-inline:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--m);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--acc)}
.plan{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:6px;align-items:center;margin-top:18px}
.plan b{text-align:center;font-weight:500;color:var(--m);padding-bottom:4px}.plan b.today{color:var(--acc)}
.plan .hr{color:var(--m);font-size:13px;text-align:center}
main .plan input{padding:12px 4px;text-align:center;font-size:13px;border-radius:10px;min-width:0}
main .plan input.f{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.pop{animation:pop .24s ease forwards}@keyframes pop{0%{transform:scale(1)}45%{transform:scale(.9)}100%{transform:scale(1.06)}}
main{transition:opacity .2s,transform .2s}main.out{opacity:0;transform:translateY(-6px)}
main.in{animation:enter .4s cubic-bezier(.2,.7,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985)}}
.btn,.tile,.bk,.chip{transition:transform .15s,border-color .15s}.btn:active,.tile:active,.bk:active,.chip:active{transform:scale(.95)}
@media(prefers-reduced-motion:reduce){.pop,main.in{animation:none}main{transition:none}}
.bump{animation:bump .45s ease}@keyframes bump{40%{transform:scale(1.1)}}
main .plan input{transition:background .4s,border-color .4s,color .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
main.in .tile,main.in .bk{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
main.in .tile:nth-child(2),main.in .bk:nth-child(2){animation-delay:.06s}main.in .tile:nth-child(3),main.in .bk:nth-child(3){animation-delay:.12s}main.in .tile:nth-child(4),main.in .bk:nth-child(4){animation-delay:.18s}main.in .tile:nth-child(5),main.in .bk:nth-child(5){animation-delay:.24s}main.in .tile:nth-child(6),main.in .bk:nth-child(6){animation-delay:.3s}
.pop{animation:pop .24s ease forwards!important}
.chip,.btn{transition:transform .15s,border-color .15s,background .2s,color .2s}
body,.card{transition:background-color .3s,border-color .3s,color .3s}
@media(hover:hover){.btn:hover,.tile:hover,.bk:hover{transform:translateY(-2px)}}
.btn:active,.tile:active,.bk:active,.chip:active{transform:scale(.95)}
.btn,.tile,.bk,.chip,.ib{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.toast{animation:ti .3s both}@keyframes ti{from{opacity:0;transform:translate(-50%,12px)}}
@media(pointer:coarse){main input:not([type=checkbox]),select,textarea,main .plan input{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,.pop{animation:none!important;transition:none!important}}
.avc{width:52px;height:52px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid var(--line)}.avc.on{border-color:var(--acc)}
img.av{width:96px;height:96px;object-fit:cover;display:block;border:2px solid var(--line)}
.pc{position:relative}.dt{position:absolute;top:5px;right:5px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--m);cursor:pointer}.dt::after{content:"";position:absolute;inset:-9px}
.av{width:72px;height:72px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:500 30px Fraunces,Georgia,serif;margin:0 auto 8px}
@media(max-width:760px){.ed{grid-template-columns:1fr}.ed>div:first-child{max-width:200px}.stage>.ib{display:none}.tiles{gap:10px}}
.ib{position:relative}.bdg{position:absolute;top:0;right:0;background:var(--acc);color:#fff;border-radius:99px;font-size:11px;font-weight:500;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 5px}.bdg:empty{display:none}
.splash{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:20px;animation:enter .3s both}.splash .card{margin:0;max-height:80vh;overflow:auto;width:100%}.splash li{margin:8px 0}
.logo{letter-spacing:.04em}
.fc{min-height:220px;border:1px solid var(--line);background:var(--card);border-radius:24px;display:grid;place-items:center;text-align:center;padding:28px 22px;font:500 26px/1.3 Fraunces,Georgia,serif;overflow-wrap:anywhere;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.fc.bk2{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.fc small{display:block;font:12px Inter,system-ui,sans-serif;color:var(--m);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.stat b{display:block;font:500 26px Fraunces,Georgia,serif}.stat span{color:var(--m);font-size:13px}
.big{font:500 52px/1.1 Fraunces,Georgia,serif;margin:6px 0}
.ed2{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:start;margin:10px 0}
.hbar{display:flex;align-items:center;gap:10px;margin:10px 0}.hbar span{width:110px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .prog{flex:1}.hbar em{font-style:normal;min-width:44px;text-align:right;font-size:14px}
.hist{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}.hist i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0}.hist span,.hist em{font-size:11px;color:var(--m);font-style:normal}.hist em{margin-top:4px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-weight:500;color:var(--m);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--card);flex-wrap:wrap}.seg button{border:0;background:none;padding:7px 16px;border-radius:99px;cursor:pointer}.seg button.on{background:var(--acc);color:#fff}
.gf{display:grid;grid-template-columns:1.2fr 1.2fr .7fr 1fr auto;gap:10px;align-items:end;margin-top:16px}
@media(max-width:700px){.ed2{grid-template-columns:1fr}.gf{grid-template-columns:1fr 1fr}.gf>.btn{grid-column:1/-1}}
.btn svg{width:22px;height:22px;display:block}
.mi{display:block;max-width:100%;max-height:260px;border-radius:10px;margin:4px 0}
.msg a{display:block}
.ttb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.ttc{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:18px;font:500 56px/1 Fraunces,Georgia,serif;cursor:pointer;color:var(--ink);padding:0}
.ttc:disabled{cursor:default;opacity:1;color:var(--ink)}.ttc.x:disabled{color:var(--acc)}
.ttc:not(:disabled):hover{border-color:var(--acc)}
.ttc.w{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.chb{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,520px);aspect-ratio:1;margin:0 auto;border:3px solid var(--acc);border-radius:14px;overflow:hidden;box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 25%,transparent);user-select:none;-webkit-user-select:none}
.chs{position:relative;border:0;margin:0;padding:0;display:grid;place-items:center;cursor:pointer;min-width:0;aspect-ratio:1}
.chs.l{background:#ffeadb}.chs.d{background:#e8803a}
.chs:disabled{cursor:default}.chs:focus-visible{outline-offset:-3px}
.chs.lm{box-shadow:inset 0 0 0 100px rgba(255,214,60,.45)}.chs.sel{box-shadow:inset 0 0 0 100px rgba(255,214,60,.8)}.chs.ck{box-shadow:inset 0 0 0 100px rgba(214,40,40,.6)}
.chs.tg::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(70,30,5,.35);pointer-events:none}
.chs.tc::after{content:"";position:absolute;inset:5%;border-radius:50%;border:4px solid rgba(70,30,5,.4);pointer-events:none}
.chs i{position:absolute;font:600 10px/1 Inter,system-ui,sans-serif;pointer-events:none;opacity:.85}.chs .rk{left:3px;top:3px}.chs .fl{right:3px;bottom:3px}
.chs.l i{color:#c8601b}.chs.d i{color:#ffeadb}
.cp{font-size:clamp(24px,9vw,54px);line-height:1;pointer-events:none}
.cp.pw{color:#fff;text-shadow:0 0 1px #4a2108,0 0 2px #4a2108,0 1px 3px #4a2108}.cp.pb{color:#26140a}
.btn:disabled{opacity:.4;cursor:default}
.bnc{width:72px;height:40px;border-radius:12px;cursor:pointer;border:2px solid var(--line);flex:none}.bnc.on{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:1px}
.gv{border-radius:50%;background:var(--acc) center/cover;color:#fff;display:grid;place-items:center;font:500 18px Fraunces,Georgia,serif;flex:none;overflow:hidden}
.msg a{color:inherit;text-decoration:underline}
#rd{position:fixed;inset:0;z-index:30;background:#101010;color:#fff;overscroll-behavior:none;user-select:none;-webkit-user-select:none;animation:enter .25s both}
.rdv{position:absolute;inset:0;overflow:hidden;touch-action:none}
.rdt{display:flex;height:100%;will-change:transform}
.rds{flex:0 0 100%;height:100%;overflow:hidden}
.rdz{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 52px) 8px calc(env(safe-area-inset-bottom,0px) + 40px);will-change:transform}
.rdz img{max-height:100%;min-width:0;object-fit:contain;background:#fff;display:block;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.rdb{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;pointer-events:none;transition:opacity .25s}
.rdtop{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);background:linear-gradient(rgba(0,0,0,.55),transparent)}
.rdbot{bottom:0;justify-content:center;font-size:13px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(transparent,rgba(0,0,0,.55))}
.rdn{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 16px Fraunces,Georgia,serif}
.rdx{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.rdar{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:64px;font-size:30px;border-radius:12px;cursor:pointer;z-index:2}.rdar.l{left:10px}.rdar.r{right:10px}

#rd.zm .rdb{opacity:0}

const WINL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const tWin=b=>{for(const[a,c,d]of WINL)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return{w:b[a],l:[a,c,d]};return b.every(x=>x)?{w:'D',l:[]}:null};
function mm(b,turn,d){
 const r=tWin(b);if(r)return r.w=='O'?10-d:r.w=='X'?d-10:0;
 let best=turn=='O'?-99:99;
 for(let i=0;i<9;i++)if(!b[i]){b[i]=turn;const s=mm(b,turn=='O'?'X':'O',d+1);b[i]='';best=turn=='O'?Math.max(best,s):Math.min(best,s)}
 return best
}
function cpuMove(){
 const b=TT.b,free=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
 if(TT.lvl=='easy'&&Math.random()<.6)return free[Math.random()*free.length|0];
 let best=-99,mv=[];
 for(const i of free){b[i]='O';const s=mm(b,'X',1);b[i]='';if(s>best){best=s;mv=[i]}else if(s==best)mv.push(i)}
 return mv[Math.random()*mv.length|0]
}

 const W=c.clientWidth,H=c.clientHeight,cam=KT.cam;if(!W||!H)return;
 if(KT.w!=W||KT.h!=H){KT.w=W;KT.h=H;R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}
 if(KT.state=='idle'){const t=performance.now()/5000,b=KT.T.b,cx=(b[0]+b[2])/2,cz=(b[1]+b[3])/2,z=Math.max(b[2]-b[0],b[3]-b[1]);cam.position.set(cx+Math.cos(t)*z*.8,z*.55,cz+Math.sin(t)*z*.8);cam.lookAt(cx,0,cz)}
 else{
  const me=KT.ks[0],fx=Math.cos(KT.ca),fz=Math.sin(KT.ca);
  cam.position.set(me.x-fx*95,48,me.y-fz*95);cam.lookAt(me.x+fx*40,10,me.y+fz*40);
  [...KT.ks,...Object.values(KT.o)].forEach(k=>{if(!k.m){k.m=k3Kart(k.ci,k.si,k.hi);S.add(k.m)}k.m.position.set(k.x,1,k.y);k.m.rotation.y=-k.a})
 }
 R.render(S,cam);kHud()
}
function kLoop(ts){
 if(V!='kart'||$('#kc')!==KT.c){kStop();return}
 const dt=Math.min(.05,(ts-KT.ts)/1000||0);KT.ts=ts;kStep(dt,ts);kDraw();KT.raf=requestAnimationFrame(kLoop)
}
function kKey(e){
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
 if(e.type=='keydown'&&(e.key=='Enter'||e.key==' ')&&KT.state=='lobby'){kReady();e.preventDefault();return}
 const k={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowDown:'b',s:'b',ArrowUp:'g',w:'g'}[e.key];
 if(k){KT.in[k]=e.type=='keydown'?1:0;if(KT.state!='idle')e.preventDefault()}
}
async function kInit(){
 kStop();const c=$('#kc');if(!c)return;
 Object.assign(KT,{c,state:'idle',ks:[],o:{},in:{},T:kT(KT.tr)});kIntro();kStepTo(KT.step);KT.fs=0;const kg=$('#kgame');if(kg)kg.onfullscreenchange=()=>{if(!document.fullscreenElement&&KT.fs)kFS(false)};
 try{await k3Load()}catch(e){return toast('Das 3D-Spiel konnte nicht geladen werden. Prüfe deine Internetverbindung.')}
 if($('#kc')!==c)return;
 try{KT.R=new THREE.WebGLRenderer({canvas:c,antialias:true})}catch(e){return toast('Dein Gerät kann 3D im Browser nicht darstellen.')}
 KT.R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));KT.cam=new THREE.PerspectiveCamera(70,1,4,9000);k3Build();
 addEventListener('keydown',kKey);addEventListener('keyup',kKey);
 document.querySelectorAll('#kctl [data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{KT.in[k]=1;b.classList.add('d');e.preventDefault()};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{KT.in[k]=0;b.classList.remove('d')};b.oncontextmenu=e=>e.preventDefault()});
 if(KT.mode=='multi'&&KT.room){KT.cn='';kNet()}
 KT.ts=performance.now();KT.raf=requestAnimationFrame(kLoop)
}
function kStop(){
 cancelAnimationFrame(KT.raf);removeEventListener('keydown',kKey);removeEventListener('keyup',kKey);
 if(KT.ch){sb.removeChannel(KT.ch);KT.ch=null}KT.cn='';KT.c=null;if(KT.fs){KT.fs=0;document.body.style.overflow='';if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}}
 if(KT.R){KT.R.dispose();if(KT.R.forceContextLoss)KT.R.forceContextLoss();KT.R=null}KT.S=null
}

const toJ=async s=>{const b=await(await fetch(s)).blob(),u=URL.createObjectURL(b),im=new Image;im.src=u;await im.decode();const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return[c.toDataURL('image/jpeg',.88),c.width,c.height]};
async function dl(all){const d=await window.claude?.use('downloads');const k=innerWidth>760?2:1,a=all?0:pi,b=all?cur.pages.length:Math.min(pi+k,cur.pages.length);toast('Wird vorbereitet …');try{let pdf;for(let i=a;i<b;i++){const[u,w,h]=await toJ(cur.pages[i].url),o=w>h?'l':'p',f=[w*.75,h*.75];if(pdf)pdf.addPage(f,o);else pdf=new window.jspdf.jsPDF({unit:'pt',format:f,orientation:o});pdf.addImage(u,'JPEG',0,0,f[0],f[1])}const fn=cur.title.replace(/[^\p{L}\p{N} -]/gu,'')+(all?'':' Seite '+(a+1)+(b-a>1?'-'+b:''))+'.pdf';if(d)await d.save({filename:fn,data:pdf.output('blob')});else pdf.save(fn)}catch(e){if(e?.code!='declined')toast('Das Speichern hat nicht geklappt.')}}

 const d=DK.find(x=>x.id==P.d),c=DKc[d.id],own=d.owner==ME.id||ME.role=='admin',rs=DKr[d.id]||[],rdy=c.filter(x=>x.front.trim()&&x.back.trim()).length;
 return `<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(d.title)}</h1><span class="chip ${REV?'on':''}" onclick="REV=!REV;render()">Rückseite zuerst</span><button class="btn o" onclick="startLearn('${d.id}')">Üben</button>${own?`<button class="btn g" onclick="delDeck('${d.id}')">Stapel löschen</button>`:''}</div><p class="m">${[d.fach,d.stufe&&'Klasse '+d.stufe,rdy+' Karten',d.owner!=ME.id&&'von '+dn(byId(d.owner))].filter(Boolean).map(esc).join(', ')}</p>${own?`<div class="card" style="max-width:none"><label style="margin-top:0">Titel</label><input maxlength="80" value="${esc(d.title)}" oninput="dset('title',this.value)"><label>Fach (optional)</label><select onchange="dset('fach',this.value||null)"><option value="">–</option>${FACH.map(f=>`<option ${f==d.fach?'selected':''}>${f}</option>`).join('')}</select><label>Klasse (optional)</label><select onchange="dset('stufe',this.value?+this.value:null)"><option value="">–</option>${STU.map(s=>`<option ${s==d.stufe?'selected':''}>${s}</option>`).join('')}</select><div class="row" style="margin-top:8px"><span>Andere dürfen diesen Stapel üben</span><input type="checkbox" ${d.shared?'checked':''} onchange="dset('shared',this.checked)"></div></div><h2>Karteikarten</h2><p class="m" style="margin:-4px 0 8px">Links steht die Vorderseite, rechts die Rückseite mit der Lösung. Alles wird automatisch gespeichert.</p><div id="cl">${c.map(crow).join('')}</div><div class="bar"><button class="btn g" onclick="addCard()">Karte hinzufügen</button><button class="btn g" onclick="$('#bulk').hidden=!$('#bulk').hidden">Aus Text einfügen</button></div><div class="card" id="bulk" hidden style="max-width:none"><p class="m" style="margin:0 0 8px">Eine Karte pro Zeile: Vorderseite ; Rückseite. Zum Beispiel: la maison ; das Haus</p><textarea id="bt" rows="6"></textarea><p style="margin:14px 0 0"><button class="btn o" onclick="bulkAdd()">Karten hinzufügen</button></p></div>`:`<div class="card" style="max-width:none"><p class="m" style="margin:0">Dieser Stapel gehört ${esc(dn(byId(d.owner)))}. Du kannst ihn üben, aber nicht ändern.</p></div>`}${rs.length?`<h2>Deine letzten Runden</h2><div class="card" style="padding:6px 24px;max-width:none">${rs.map(r=>`<div class="row"><span class="m">${fdt(r.created_at)}</span><span>${r.correct} von ${r.total} richtig</span><b>${r.total?Math.round(r.correct/r.total*100):0} %</b></div>`).join('')}</div>`:''}`
},
learn:()=>{
 const d=DK.find(x=>x.id==P.d),n=L.q.length;
 if(L.i>=n){
  const ok=L.ok.length,pct=Math.round(ok/n*100);
  return `<h1>Runde geschafft</h1><p class="m">${esc(d.title)}</p><div class="card" style="max-width:none;text-align:center"><div class="big">${ok} von ${n}</div><p class="m" style="margin:0">${pct} % richtig</p><div class="prog" style="margin:18px 0 0"><i style="width:${pct}%"></i></div></div><div class="stat"><div><b>${ok}</b><span>richtig</span></div><div><b>${L.bad.length}</b><span>falsch</span></div><div><b>${pct} %</b><span>Quote</span></div></div>${L.bad.length?`<h2>Das war noch falsch</h2><div class="card" style="padding:6px 24px;max-width:none">${L.bad.map(c=>`<div class="row"><span>${esc(c.front)}</span><span class="m">${esc(c.back)}</span></div>`).join('')}</div>`:'<p>Alles richtig. Stark!</p>'}<p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn o" onclick="startLearn('${d.id}')">Neue Runde</button>${L.bad.length?`<button class="btn g" onclick="startLearn('${d.id}',L.bad.map(c=>c.id))">Falsche nochmal</button>`:''}<button class="btn g" onclick="bk()">Zurück zum Stapel</button></p>`
 }
 const c=L.q[L.i],txt=L.flip!=L.rev?c.back:c.front,lab=L.flip!=L.rev?'Rückseite':'Vorderseite';
 return `<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(d.title)}</h1><span class="m">${L.i+1} von ${n}</span></div><div class="prog" style="margin:12px 0 18px"><i style="width:${L.i/n*100}%"></i></div><div class="fc ${L.flip?'bk2':''}" onclick="flipC()" role="button" tabindex="0" aria-label="Karte umdrehen"><div><small>${lab}</small>${esc(txt)}</div></div><p style="text-align:center;margin:20px 0 0">${L.flip?`<button class="btn g" onclick="ansC(0)">Falsch</button> <button class="btn o" onclick="ansC(1)">Richtig</button>`:`<button class="btn o" onclick="flipC()">Umdrehen</button>`}</p><p class="m" style="text-align:center;font-size:13px">Tastatur: Leertaste dreht um, Pfeil rechts heißt richtig, Pfeil links heißt falsch.</p>`
},
noten:()=>{
 const note=GM=='note',gl=GR.filter(g=>g.system==GM),vals=gl.map(g=>g.value),n=vals.length,a=mean(vals),
  best=n?(note?Math.min(...vals):Math.max(...vals)):0,worst=n?(note?Math.max(...vals):Math.min(...vals)):0;
 const m=new Map();gl.forEach(g=>{const k=g.fach.trim().toLowerCase();if(!m.has(k))m.set(k,{f:g.fach.trim(),v:[]});m.get(k).v.push(g.value)});
 const subs=[...m.values()].map(s=>({f:s.f,a:mean(s.v)})).sort((x,y)=>note?x.a-y.a:y.a-x.a);
 const keys=note?[1,2,3,4,5,6]:Array.from({length:16},(_,i)=>i),cnt=keys.map(k=>vals.filter(v=>note?Math.min(6,Math.max(1,Math.round(v)))==k:v==k).length),mx=Math.max(1,...cnt);
 const asc=gl.slice().reverse();
 return `<h1>Noten</h1><p class="m">Trag deine Noten oder MSS-Punkte ein und sieh dir die Statistik dazu an. Nur du siehst deine Einträge.</p><div class="card" style="max-width:none"><div class="seg" role="group" aria-label="Notensystem"><button class="${note?'on':''}" onclick="GM='note';render()">Noten (1 bis 6)</button><button class="${note?'':'on'}" onclick="GM='punkte';render()">MSS-Punkte (0 bis 15)</button></div><form class="gf" onsubmit="addGrade();return false"><div><label style="margin-top:0">Fach</label><input id="gf" list="fl" maxlength="40" placeholder="z. B. Mathe" required></div><div><label style="margin-top:0">Bezeichnung (optional)</label><input id="gt" maxlength="60" placeholder="z. B. Klassenarbeit 2"></div><div><label style="margin-top:0">${note?'Note':'Punkte'}</label><input id="gv" type="number" inputmode="decimal" step="${note?'0.1':'1'}" min="${note?1:0}" max="${note?6:15}" required></div><div><label style="margin-top:0">Datum</label><input id="gd" type="date" value="${todayStr()}"></div><button class="btn o" type="submit">Hinzufügen</button></form><datalist id="fl">${FACH.map(f=>`<option value="${f}">`).join('')}</datalist></div><h2>Einträge</h2><div class="card" style="padding:6px 16px;max-width:none">${n?`<table class="tbl"><thead><tr><th>Datum</th><th>Fach</th><th>${note?'Note':'Punkte'}</th><th></th></tr></thead><tbody>${gl.map(g=>`<tr><td>${fd(g.given_on)}</td><td>${esc(g.fach)}${g.title?`<br><span class="m" style="font-size:13px">${esc(g.title)}</span>`:''}</td><td><b>${fn(g.value)}</b></td><td style="text-align:right"><button class="ib" style="display:inline-flex" aria-label="Eintrag löschen" onclick="delGrade('${g.id}')">×</button></td></tr>`).join('')}</tbody></table>`:'<p class="m">Noch keine Einträge.</p>'}</div>${n?`<h2>Statistik</h2><div class="stat"><div><b>${fn(a)}</b><span>Durchschnitt${note?'':' (ca. Note '+fn(Math.max(1,(17-a)/3),1)+')'}</span></div><div><b>${fn(best)}</b><span>Bester Wert</span></div><div><b>${fn(worst)}</b><span>Schlechtester Wert</span></div><div><b>${n}</b><span>Einträge</span></div></div><div class="card" style="max-width:none"><b>Nach Fach</b>${subs.map(s=>`<div class="hbar"><span title="${esc(s.f)}">${esc(s.f)}</span><div class="prog"><i style="width:${Math.max(4,note?(6-s.a)/5*100:s.a/15*100)}%"></i></div><em>${fn(s.a)}</em></div>`).join('')}<p class="m" style="font-size:13px;margin:8px 0 0">Längerer Balken heißt besser.</p></div><div class="card" style="max-width:none"><b>${note?'Notenverteilung (gerundet)':'Verteilung der Punkte'}</b><div class="hist">${keys.map((k,i)=>`<div><span>${cnt[i]||''}</span><i style="height:${Math.round(cnt[i]/mx*90)}px"></i><em>${k}</em></div>`).join('')}</div></div><div class="card" style="max-width:none"><b>Verlauf</b>${n>1?`${gchart(asc)}<p class="m" style="font-size:13px;margin:8px 0 0">Die Linie ist dein Durchschnitt über die Zeit, die Kreise sind einzelne Werte. Oben ist besser.</p>`:'<p class="m">Ab zwei Einträgen siehst du hier den Verlauf.</p>'}</div>`:''}`
},
gruppen:()=>{const my=GRP.filter(gmine),pub=GRP.filter(g=>g.is_public&&!gmine(g)),row=(g,b)=>`<div class="row"><span style="display:flex;gap:12px;align-items:center;min-width:0">${gav(g)}<span style="min-width:0">${esc(g.name)}<span class="m">${g.is_public?'':' · privat'}, ${gcnt(g)} Mitglieder</span>${g.descr?`<br><span class="m" style="font-size:13px">${esc(g.descr.slice(0,80))}</span>`:''}</span></span>${b}</div>`;
return `<h1>Gruppen</h1><p class="m">Öffentliche Gruppen kann jeder betreten. Private Gruppen brauchen Name und Passwort.</p><div class="card" style="max-width:none"><label style="margin-top:0">Private Gruppe beitreten</label><div class="bar" style="margin:0"><input id="jn" placeholder="Gruppenname" autocapitalize="none"><input id="jp" type="password" placeholder="Passwort" autocomplete="off" onkeydown="event.key=='Enter'&&gJoin()"><button class="btn o" onclick="gJoin()">Beitreten</button></div></div><p><button class="btn g" onclick="go('gneu')">Neue Gruppe erstellen</button></p><h2>Meine Gruppen</h2><div class="card" style="padding:6px 24px;max-width:none">${my.map(g=>row(g,`<button class="btn o" onclick="go('gruppe',{g:'${g.id}'})">Öffnen</button>`)).join('')||'<p class="m">Du bist noch in keiner Gruppe.</p>'}</div><h2>Öffentliche Gruppen</h2><div class="card" style="padding:6px 24px;max-width:none">${pub.map(g=>row(g,`<button class="btn o" onclick="gJoin('${g.id}')">Beitreten</button>`)).join('')||'<p class="m">Noch keine öffentlichen Gruppen.</p>'}</div>`},
gneu:()=>{const pm=['admin','moderator'].includes(ME.role);return `<h1>Neue Gruppe</h1><div class="card"><label style="margin-top:0">Name</label><input id="gnm" maxlength="40" placeholder="3 bis 40 Zeichen"><label>Beschreibung (optional)</label><textarea id="gdesc" rows="3" maxlength="500"></textarea><label>Art</label><select id="gty" onchange="$('#gpw').parentNode.style.display=this.value=='pub'?'none':''">${pm?'<option value="pub">Öffentlich (jeder kann beitreten)</option>':''}<option value="priv">Privat (Name und Passwort)</option></select><div ${pm?'style="display:none"':''}><label>Passwort (mindestens 4 Zeichen)</label><input id="gpw" type="password" autocomplete="new-password"></div>${pm?'':'<p class="m" style="font-size:13px;margin-bottom:0">Öffentliche Gruppen können nur Moderatoren und Admins erstellen.</p>'}<p style="margin:22px 0 0"><button class="btn o" onclick="gMake()">Erstellen</button></p></div>`},

gedit:()=>{const g=GRP.find(x=>x.id==P.g);return `<h1>Gruppe bearbeiten</h1><div class="card"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${gav(g,72)}<label class="btn g" style="margin:0;font-size:15px">Gruppenbild<input type="file" accept="image/*" hidden onchange="gImg(this)"></label>${g.image_path?'<button class="btn g" onclick="gRmImg()">Entfernen</button>':''}</div><label>Name</label><input id="gnm" maxlength="40" value="${esc(g.name)}"><label>Beschreibung</label><textarea id="gdesc" rows="3" maxlength="500">${esc(g.descr)}</textarea>${g.is_public?'':'<label>Neues Passwort (leer lassen, wenn es gleich bleibt)</label><input id="gpw" type="password" autocomplete="new-password">'}<p style="margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap"><button class="btn o" onclick="gSave()">Speichern</button><button class="btn g" onclick="gDel('${g.id}')">Gruppe löschen</button></p></div>`},
fwd:()=>{const x=DB.find(i=>i.id==P.id),fr=frs().friends,my=GRP.filter(gmine),b=(k,id)=>`<button class="btn ${FW[k+id]?'g':'o'}" onclick="fwdTo('${k}','${id}')">${FW[k+id]?'Nochmal senden':'Senden'}</button>`;
return `<h1>Weiterleiten</h1><p class="m">${esc(x.title)}</p><h2>An Freunde</h2><div class="card" style="padding:6px 24px;max-width:none">${fr.map(id=>`<div class="row"><span>${pn(byId(id))}</span>${b('u',id)}</div>`).join('')||'<p class="m">Noch keine Freunde.</p>'}</div><h2>An Gruppen</h2><div class="card" style="padding:6px 24px;max-width:none">${my.map(g=>`<div class="row"><span style="display:flex;gap:12px;align-items:center">${gav(g,36)}${esc(g.name)}</span>${b('g',g.id)}</div>`).join('')||'<p class="m">Du bist in keiner Gruppe.</p>'}</div>`},
kart:()=>{const cpu=KT.mode!='multi',tb=(i,t)=>`<button class="tab" data-s="${i}" onclick="kStepTo(${i})">${i+1}. ${t}</button>`,dots=n=>'●'.repeat(n)+'○'.repeat(5-n),
 sw=(t,a,l)=>a.map((c,i)=>`<button class="ksw ${i==KT[t]?'on':''}" data-p="${t}" data-i="${i}" style="background:${c}" aria-label="${l} ${i+1}" onclick="kPick('${t}',${i})"></button>`).join('');
return `<h1>Kart-Rennen 3D</h1><div id="kmenu"><div class="bar" style="margin-top:0"><div class="seg" role="group" aria-label="Modus"><button class="${cpu?'on':''}" onclick="kMode('cpu')">Gegen Computer</button><button class="${cpu?'':'on'}" onclick="kMode('multi')">Mehrspieler</button></div><button class="btn g" onclick="kBest()">Bestenliste</button></div><div class="tabs">${tb(0,'Auto')}${tb(1,'Charakter')}${tb(2,'Strecke')}</div><div class="card" style="max-width:none;margin-top:16px"><div class="ksp" data-s="0"><div class="kgrid">${KCAR.map((c,i)=>`<div class="kc ${i==KT.car?'on':''}" data-p="car" data-i="${i}" onclick="kPick('car',${i})"><span class="kpv" style="--c:${c.c}"></span><b>${c.n}</b><span class="m" style="display:block;font-size:13px">Tempo ${dots(c.t)}<br>Start ${dots(c.a)}<br>Lenkung ${dots(c.l)}</span></div>`).join('')}</div></div><div class="ksp" data-s="1"><div style="display:flex;gap:28px;flex-wrap:wrap;align-items:center"><span class="kch" id="kchp" style="--sk:${SK[KT.skin]};--sh:${SC[KT.col]}"><i></i></span><div><label style="margin-top:0">Hautton</label><div class="kw">${sw('skin',SK,'Hautton')}</div><label>Farbe</label><div class="kw">${sw('col',SC,'Farbe')}</div></div></div></div><div class="ksp" data-s="2"><label style="margin-top:0">Strecke</label><div class="bar" style="margin:0" id="ktr">${KTR.map((t,i)=>`<button class="btn ${i==KT.tr?'o':'g'}" onclick="kSel(${i})">${t.n}</button>`).join('')}</div><p class="m" id="ktd" style="margin:10px 0 0">${KTR[KT.tr].d}</p>${cpu?'':`<label>Raumcode (alle Mitspieler geben denselben Code ein)</label><div class="bar" style="margin:0"><input id="kr" maxlength="12" value="${esc(KT.room)}" placeholder="z. B. kart1" onchange="KT.room=this.value.trim().toLowerCase();kNet()"><button class="btn g" onclick="kRand()">Zufälliger Code</button></div><div class="bar" style="margin:14px 0 0"><select id="kf">${frs().friends.map(id=>`<option value="${id}">${esc(nm(id))}</option>`).join('')}</select><button class="btn g" onclick="kInv()">Freund einladen</button></div>`}<p style="margin:16px 0 0"><button class="btn o" onclick="kGo()">Zur Startaufstellung</button></p></div><div class="bar" style="margin:18px 0 0"><button class="btn g" id="kpv0" onclick="kStepTo(KT.step-1)">Zurück</button><button class="btn o" id="knx" onclick="kStepTo(KT.step+1)">Weiter</button></div></div><p class="m">Am PC: ↑ Gas, ↓ Bremse, ← → lenken. Auf dem iPad: links lenken, rechts Gas und Bremse.</p></div><div id="kgame" style="position:relative;margin-top:14px"><canvas id="kc" style="width:100%;height:min(76vh,720px);min-height:300px;border-radius:14px;touch-action:none;background:#222;display:block"></canvas><div id="kh" style="position:absolute;inset:0;pointer-events:none"></div><div id="kback" style="position:absolute;right:10px;top:10px;display:none;gap:8px"><button class="btn g" id="kfs" onclick="kFS(!KT.fs)">Vollbild beenden</button><button class="btn g" onclick="kBack()">Menü</button></div><div id="kctl"><div><button class="kp" data-k="l" style="width:84px;height:84px;background:#334155" aria-label="Links">◀</button><button class="kp" data-k="r" style="width:84px;height:84px;background:#334155" aria-label="Rechts">▶</button></div><div><button class="kp" data-k="b" style="width:84px;height:100px;background:#d62828">Bremse</button><button class="kp" data-k="g" style="width:96px;height:150px;background:#2f9e44">Gas</button></div></div></div>`},
kbest:()=>{const t=P.t||0,rows=KB.filter(r=>r.track==t).sort((a,b)=>a.ms-b.ms).slice(0,20);
return `<h1>Bestenliste</h1><p class="m">Die schnellste Zeit jedes Spielers für 3 Runden.</p><div class="bar" style="margin-top:0">${KTR.map((x,i)=>`<button class="btn ${i==t?'o':'g'}" onclick="go('kbest',{t:${i}},1)">${x.n}</button>`).join('')}</div><div class="card" style="padding:6px 24px;max-width:none">${rows.length?rows.map((r,i)=>`<div class="row"><span><b>${i+1}.</b> ${r.user_id==ME.id?'<b>Du</b>':esc(nm(r.user_id))}<span class="m" style="font-size:13px"> · ${KCAR[r.car]?KCAR[r.car].n:''}</span></span><b>${kFmt(r.ms)}</b></div>`).join(''):'<p class="m">Noch keine Zeiten. Fahr das erste Rennen!</p>'}</div>`},
spiele:()=>`<h1>Spiele</h1><p class="m">Eine kleine Pause zwischendurch.</p><div class="tiles" style="margin-top:20px">${tl([['game','Tic Tac Toe','Gegen den Computer, zu zweit oder online','ttt'],['game','Kart-Rennen 3D','Gegen den Computer oder online mit Freunden','kart'],['chess','Schach','Gegen den Computer, zu zweit oder online','chess']])}</div>`,
chess:()=>{
 if(CH.gid!='l'){CH.gid='l';CH.sel=-1;CH.pm=null}
 const C=chLocal(),cpu=C.mode=='cpu',R=chRep(C.hist.join(' ')),st=chStat(R.s,R.keys),think=cpu&&!st&&R.s.t!=C.me,sg=(a,v,f)=>`<div class="seg" role="group">${a.map(([k,l])=>`<button class="${v==k?'on':''}" onclick="${f}('${k}')">${l}</button>`).join('')}</div>`,
 msg=st?(st.res=='draw'?'Remis ('+st.why+').':cpu?(st.res==C.me?'Du hast gewonnen!':'Der Computer hat gewonnen.'):(st.res=='w'?'Weiß':'Schwarz')+' hat gewonnen ('+st.why+').'):think?'Der Computer denkt …':(cpu?'Du bist dran':(R.s.t=='w'?'Weiß':'Schwarz')+' ist dran')+(chChk(R.s)?' – Schach!':'.');
 return `<h1>Schach</h1><div class="bar" style="margin-top:0"><div class="seg" role="group" aria-label="Modus"><button class="${cpu?'on':''}" onclick="chMode('cpu')">Gegen Computer</button><button class="${cpu?'':'on'}" onclick="chMode('two')">Zu zweit</button><button onclick="go('chessf')">Mit Freunden</button></div>${cpu?sg([['easy','Leicht'],['mid','Mittel'],['hard','Schwer']],C.lvl,'chLvl')+sg([['w','Weiß'],['b','Schwarz']],C.me,'chSide'):''}</div><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p>${chBoard(R,cpu&&C.me=='b',!!st||think)}<p style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn g" onclick="chUndo()" ${R.n&&!think?'':'disabled'}>Zug zurück</button><button class="btn o" onclick="chNewG()">Neue Partie</button></p>`},
chessf:()=>{
 const fr=frs().friends,g=CGAMES,act=g.filter(x=>!x.result),fin=g.filter(x=>x.result),opp=x=>x.w==ME.id?x.b:x.w,my=x=>x.w==ME.id?'w':'b';
 const w=fin.filter(x=>x.result==my(x)).length,l=fin.filter(x=>x.result!='draw'&&x.result!=my(x)).length,d=fin.length-w-l;
 const row=x=>{const o=opp(x),r=x.result,st=r?(r=='draw'?'Remis':r==my(x)?'Gewonnen':'Verloren'):(x.turn==my(x)?'<b style="color:var(--acc)">Du bist dran</b>':'Wartet auf '+esc(nm(o)));return `<div class="row"><span>${pn(byId(o))}<br><span class="m" style="font-size:13px">${st}, du spielst ${my(x)=='w'?'Weiß':'Schwarz'}</span></span><span style="display:flex;gap:8px;align-items:center"><button class="btn ${r||x.turn!=my(x)?'g':'o'}" onclick="go('chessg',{g:'${x.id}'})">Öffnen</button><button class="ib" aria-label="Partie löschen" onclick="cDel('${x.id}')">×</button></span></div>`};
 return `<h1>Schach mit Freunden</h1><p class="m">Jeder spielt an seinem eigenen Gerät. Die Farben werden zufällig verteilt.</p><h2>Freund herausfordern</h2><div class="card" style="padding:6px 24px;max-width:none">${fr.length?fr.map(id=>`<div class="row"><span>${pn(byId(id))}</span><button class="btn o" onclick="cNew('${id}')">${act.some(x=>opp(x)==id)?'Partie öffnen':'Herausfordern'}</button></div>`).join(''):`<p class="m">Du hast noch keine Freunde.</p><p><button class="btn g" onclick="go('freunde')">Freunde hinzufügen</button></p>`}</div>${act.length?`<h2>Laufende Partien</h2><div class="card" style="padding:6px 24px;max-width:none">${act.map(row).join('')}</div>`:''}${fin.length?`<h2>Beendet</h2><div class="stat"><div><b>${w}</b><span>Siege</span></div><div><b>${d}</b><span>Remis</span></div><div><b>${l}</b><span>Niederlagen</span></div></div><div class="card" style="padding:6px 24px;max-width:none">${fin.slice(0,10).map(row).join('')}</div>`:''}`},
chessg:()=>{
 const g=CGAMES.find(x=>x.id==P.g);
 if(CH.gid!=g.id){CH.gid=g.id;CH.sel=-1;CH.pm=null}
 const me=g.w==ME.id?'w':'b',ot=me=='w'?'b':'w',o=me=='w'?g.b:g.w,R=chRep(g.hist),over=!!g.result,mine=!over&&g.turn==me,why=g.reason?' ('+esc(g.reason)+')':'',
 msg=over?(g.result=='draw'?'Remis'+why+'.':g.result==me?'Du hast gewonnen'+why+'!':esc(nm(o))+' hat gewonnen'+why+'.'):mine?'Du bist dran'+(chChk(R.s)?' – Schach!':'.'):esc(nm(o))+' ist dran …';
 return `<h1>Schach</h1><p class="m" style="margin-bottom:0">Du (${me=='w'?'Weiß':'Schwarz'}) gegen <b style="font-weight:500">${esc(nm(o))}</b> (${me=='w'?'Schwarz':'Weiß'})</p><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p>${!over&&g.draw_offer==ot?`<div class="card" style="max-width:520px;margin:0 auto 14px;text-align:center;padding:14px"><p style="margin:0 0 10px">${esc(nm(o))} bietet Remis an.</p><button class="btn o" onclick="cAct('accept')">Annehmen</button> <button class="btn g" onclick="cAct('decline')">Ablehnen</button></div>`:''}${chBoard(R,me=='b',!mine)}<p style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${over?`<button class="btn o" onclick="cNew('${o}')">Neue Partie</button><button class="btn g" onclick="cDel('${g.id}')">Partie löschen</button>`:`${g.draw_offer==me?'<span class="m" style="align-self:center">Remis angeboten …</span>':`<button class="btn g" onclick="cAct('offer')">Remis anbieten</button>`}<button class="btn g" onclick="cAct('resign')">Aufgeben</button>`}</p>`},
ttt:()=>{
 if(!TT)ttNew();
 const t=TT,cpu=t.mode=='cpu',nm={X:cpu?'Du':'Spieler X',O:cpu?'Computer':'Spieler O'};
 const msg=t.over?(t.res.w=='D'?'Unentschieden.':cpu?(t.res.w=='X'?'Du hast gewonnen!':'Der Computer hat gewonnen.'):'Spieler '+t.res.w+' hat gewonnen!'):(cpu?(t.turn=='O'?'Der Computer denkt …':'Du bist dran (X).'):'Spieler '+t.turn+' ist dran.');
 const cells=t.b.map((v,i)=>`<button class="ttc ${v?'f '+v.toLowerCase():''} ${t.over&&t.res.l.includes(i)?'w':''}" aria-label="Feld ${i+1}, ${v||'leer'}" onclick="ttPlay(${i})" ${v||t.over?'disabled':''}>${v}</button>`).join('');
 return `<h1>Tic Tac Toe</h1><div class="bar" style="margin-top:0"><div class="seg" role="group" aria-label="Modus"><button class="${cpu?'on':''}" onclick="ttMode('cpu')">Gegen Computer</button><button class="${cpu?'':'on'}" onclick="ttMode('two')">Zu zweit</button><button onclick="go('tttf')">Mit Freunden</button></div>${cpu?`<div class="seg" role="group" aria-label="Stufe"><button class="${t.lvl=='easy'?'on':''}" onclick="ttLvl('easy')">Leicht</button><button class="${t.lvl=='hard'?'on':''}" onclick="ttLvl('hard')">Schwer</button></div>`:''}</div><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p><div class="ttb">${cells}</div><div class="stat" style="max-width:420px;margin:20px auto"><div><b>${t.sc.X}</b><span>${nm.X}</span></div><div><b>${t.sc.D}</b><span>Unentschieden</span></div><div><b>${t.sc.O}</b><span>${nm.O}</span></div></div><p style="text-align:center"><button class="btn o" onclick="ttNext()">Neue Runde</button></p>`
},
tttf:()=>{
 const fr=frs().friends,g=GAMES,act=g.filter(x=>!x.result),fin=g.filter(x=>x.result),opp=x=>x.x==ME.id?x.o:x.x,my=x=>x.x==ME.id?'X':'O';
 const w=fin.filter(x=>x.result==my(x)).length,l=fin.filter(x=>x.result!='draw'&&x.result!=my(x)).length,d=fin.length-w-l;
 const row=x=>{const o=opp(x),r=x.result,st=r?(r=='draw'?'Unentschieden':r==my(x)?'Gewonnen':'Verloren'):(x.turn==my(x)?'<b style="color:var(--acc)">Du bist dran</b>':'Wartet auf '+esc(nm(o)));return `<div class="row"><span>${pn(byId(o))}<br><span class="m" style="font-size:13px">${st}</span></span><span style="display:flex;gap:8px;align-items:center"><button class="btn ${r||x.turn!=my(x)?'g':'o'}" onclick="go('tttg',{g:'${x.id}'})">Öffnen</button><button class="ib" aria-label="Spiel löschen" onclick="tDel('${x.id}')">×</button></span></div>`};
 return `<h1>Tic Tac Toe mit Freunden</h1><p class="m">Jeder spielt an seinem eigenen Gerät. Wer dran ist, siehst du sofort.</p><h2>Freund herausfordern</h2><div class="card" style="padding:6px 24px;max-width:none">${fr.length?fr.map(id=>`<div class="row"><span>${pn(byId(id))}</span><button class="btn o" onclick="tNew('${id}')">${act.some(x=>opp(x)==id)?'Spiel öffnen':'Herausfordern'}</button></div>`).join(''):`<p class="m">Du hast noch keine Freunde.</p><p><button class="btn g" onclick="go('freunde')">Freunde hinzufügen</button></p>`}</div>${act.length?`<h2>Laufende Spiele</h2><div class="card" style="padding:6px 24px;max-width:none">${act.map(row).join('')}</div>`:''}${fin.length?`<h2>Beendet</h2><div class="stat"><div><b>${w}</b><span>Siege</span></div><div><b>${d}</b><span>Unentschieden</span></div><div><b>${l}</b><span>Niederlagen</span></div></div><div class="card" style="padding:6px 24px;max-width:none">${fin.slice(0,10).map(row).join('')}</div>`:''}`
},
tttg:()=>{
 const g=GAMES.find(x=>x.id==P.g),me=g.x==ME.id?'X':'O',o=g.x==ME.id?g.o:g.x,b=g.board.split('').map(c=>c=='-'?'':c),r=g.result?tWin(b):null,wl=r&&r.w!='D'?r.l:[],mine=!g.result&&g.turn==me;
 const msg=g.result?(g.result=='draw'?'Unentschieden.':g.result==me?'Du hast gewonnen!':esc(nm(o))+' hat gewonnen.'):(mine?'Du bist dran ('+me+').':esc(nm(o))+' ist dran …');
 const cells=b.map((v,i)=>`<button class="ttc ${v?'f '+v.toLowerCase():''} ${wl.includes(i)?'w':''}" aria-label="Feld ${i+1}, ${v||'leer'}" onclick="tMove(${i})" ${v||!mine?'disabled':''}>${v}</button>`).join('');
 return `<h1>Tic Tac Toe</h1><p class="m" style="margin-bottom:0">Du (${me}) gegen <b style="font-weight:500">${esc(nm(o))}</b> (${me=='X'?'O':'X'})</p><p role="status" style="font-size:18px;text-align:center;margin:18px 0 12px"><b>${msg}</b></p><div class="ttb">${cells}</div><p style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${g.result?`<button class="btn o" onclick="tNew('${o}')">Nochmal spielen</button>`:''}<button class="btn g" onclick="tDel('${g.id}')">${g.result?'Spiel löschen':'Aufgeben und löschen'}</button></p>`
},
notif:()=>{const f=frs(),ids=Object.keys(UNR),perm='Notification' in window?Notification.permission:'';return `<h1>Benachrichtigungen</h1>${f.inc.length?`<h2>Freundschaftsanfragen</h2><div class="card" style="padding:6px 24px;max-width:none">${f.inc.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p}'})">${pn(byId(p))}</span><button class="btn o" onclick="facc('${p}')">Annehmen</button></div>`).join('')}</div>`:''}${ME.role=='admin'&&REQS&&REQS.length?`<h2>Admin</h2><div class="card" style="padding:6px 24px;max-width:none"><div class="row"><span><b>${REQS.length}</b> Zugriffsanfrage${REQS.length>1?'n':''} für die Bücherbibliothek</span><button class="btn o" onclick="go('admin')">Öffnen</button></div></div>`:''}${AG.length?`<h2>Spiele</h2><div class="card" style="padding:6px 24px;max-width:none">${AG.map(g=>`<div class="row"><span>Tic Tac Toe: Du bist dran gegen <b>${esc(nm(g.x==ME.id?g.o:g.x))}</b></span><button class="btn o" onclick="go('tttg',{g:'${g.id}'})">Öffnen</button></div>`).join('')}</div>`:''}${ids.length?`<h2>Neue Nachrichten</h2><div class="card" style="padding:6px 24px;max-width:none">${ids.map(id=>{const m=NMSG.find(x=>x.sender==id);return `<div class="row"><span>${pn(byId(id))}<span class="m">, ${UNR[id]} neu</span><br><span class="m">${esc(String(m?(m.body||'Bild'):'').slice(0,60))}</span></span><button class="btn o" onclick="go('chat',{u:'${id}'})">Öffnen</button></div>`}).join('')}</div>`:''}${f.inc.length||ids.length||AG.length||(ME.role=='admin'&&REQS&&REQS.length)?'':'<p class="m">Nichts Neues.</p>'}${perm?`<div class="card" style="max-width:none"><b>Hinweise im Browser</b><p class="m" style="margin:6px 0 12px">${perm=='granted'?'Sie sind eingeschaltet. Du bekommst einen Hinweis, wenn die Seite im Hintergrund offen ist und etwas Neues kommt.':perm=='denied'?'Dein Browser blockiert sie gerade. Erlaube Hinweise für diese Seite in den Browser-Einstellungen.':'Bekomme einen Hinweis, wenn die Seite im Hintergrund offen ist und etwas Neues kommt. Bei geschlossener Seite gibt es keine Hinweise.'}</p>${perm=='default'?'<button class="btn o" onclick="askNotif()">Hinweise einschalten</button>':''}</div>`:''}`},
chat:()=>{const f=frs().friends;if(P.u&&f.includes(P.u)){const p=byId(P.u);return `<div class="bar" style="margin:8px 0"><h1 style="flex:1;margin:0">${esc(dn(p))}</h1><button class="btn g" onclick="go('person',{u:'${p.id}'})">Profil</button></div><div class="card" id="ms"></div><div class="bar"><input id="mi" placeholder="Nachricht schreiben" maxlength="2000" onkeydown="event.key=='Enter'&&snd()"><label class="btn g" style="margin:0;display:flex;align-items:center" title="Bild senden" aria-label="Bild senden">${ic('image')}<input type="file" accept="image/*" hidden onchange="sndImg(this)"></label><button class="btn o" onclick="snd()">Senden</button></div>`}return `<h1>Chat</h1><p class="m">Du kannst Freunden schreiben. Freunde fügst du über Name oder Code hinzu.</p><div class="card" style="padding:6px 24px;max-width:none">${f.length?f.map(id=>`<div class="row"><span>${pn(byId(id))}</span><button class="btn o" onclick="go('chat',{u:'${id}'})">Schreiben</button></div>`).join(''):'<p class="m">Noch keine Freunde.</p>'}</div><p><button class="btn g" onclick="go('freunde')">Freunde hinzufügen</button></p>`},
set:()=>`<h1>Einstellungen</h1><div class="tabs">${['Konto','Darstellung','Privatsphäre'].map(t=>`<button class="tab ${t==st?'on':''}" onclick="st='${t}';render()">${t}</button>`).join('')}</div><div class="card" style="padding:6px 24px;margin-top:16px">${SP[st]()}</div>`};
const SP={
Konto:()=>`<div class="row"><span>Angemeldet als <b>${esc(ME.username)}</b> (${ROLEN[ME.role]})</span><button class="btn g" onclick="out()">Abmelden</button></div><div class="row"><span>Benutzername<br><span class="m" style="font-size:13px">3 bis 20 Zeichen. Damit meldest du dich an.</span></span><div style="display:flex;gap:8px;align-items:center"><input id="nu" maxlength="20" autocapitalize="none" value="${esc(ME.username)}" style="max-width:170px" onkeydown="event.key=='Enter'&&chName()"><button class="btn g" onclick="chName()">Ändern</button></div></div><div class="row"><span>Profil mit Schule, Klasse und Stufe</span><button class="btn g" onclick="go('profil')">Bearbeiten</button></div><div class="row"><input id="np" type="password" placeholder="Neues Passwort" autocomplete="new-password" style="max-width:220px"><button class="btn g" onclick="npw()">Passwort ändern</button></div><div class="row"><span>Was ist neu?</span><button class="btn g" onclick="showSplash(1)">Ansehen</button></div>`,
PF:()=>`<div class="row"><span>Anzeigename</span><input style="max-width:220px" placeholder="${esc(ME.username)}" value="${esc(ME.display_name||'')}" oninput="svp('display_name',this.value.trim()||null)"></div><div class="row"><span>Benutzername</span><b>@${esc(ME.username)}</b></div><div class="row"><span>Schule</span><select style="max-width:220px" onchange="svp('school_id',this.value||null)"><option value="">–</option>${SCH.map(s=>`<option value="${s.id}" ${s.id==ME.school_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="row"><span>Klasse</span><input style="max-width:120px" placeholder="z. B. 7a" value="${esc(ME.klasse||'')}" oninput="svp('klasse',this.value)"></div><div class="row"><span>Stufe</span><select style="max-width:120px" onchange="svp('stufe',this.value?+this.value:null)"><option value="">–</option>${STU.map(v=>`<option ${v==ME.stufe?'selected':''}>${v}</option>`).join('')}</select></div>`,
Darstellung:()=>`<div class="row"><span>Darkmode</span><input type="checkbox" ${isDark()?'checked':''} onchange="sv('dark',this.checked)"></div>`,
Privatsphäre:()=>`<div class="row"><span>In der Schülerliste sichtbar</span><div class="chips">${[['Öffentlich',true],['Privat',false]].map(([l,v])=>`<span class="chip ${(ME.visible!==false)==v?'on':''}" onclick="svp('visible',${v});render()">${l}</span>`).join('')}</div></div><div class="row"><span>Freundschaftsanfragen erhalten</span><input type="checkbox" ${ME.accept_requests!==false?'checked':''} onchange="svp('accept_requests',this.checked)"></div>`};
theme();render();boot();document.addEventListener('touchstart',()=>{},{passive:true});
</script></body></html>
