const SB_URL='https://vpfzauandaqywiyyevnf.supabase.co',SB_KEY='sb_publishable_b18CcIGUxRXBOMNqhDZ8uw_PQU726Gf';

/* Die 4 Standard-Profilbilder (nur auf diesem Gerät gespeichert) */
const avs=(bg,fg)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/><circle cx="50" cy="38" r="18" fill="${fg}"/><path d="M14 100c4-26 20-38 36-38s32 12 36 38z" fill="${fg}"/></svg>`);

let S={};try{S=JSON.parse(localStorage.s||'{}')}catch(e){}
const sv=(k,v)=>{S[k]=v;try{localStorage.s=JSON.stringify(S)}catch(e){}theme()};
const isDark=()=>S.dark??matchMedia('(prefers-color-scheme: dark)').matches;
const theme=()=>document.documentElement.dataset.theme=isDark()?'dark':'light';
const IC={book:'<path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h12"/>',stoff:'<path d="M12 3 3 8l9 5 9-5zM3 13l9 5 9-5"/>',notes:'<path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',gear:(()=>{const n=8,s=2*Math.PI/n,p=[];for(let i=0;i<n;i++)for(const[r,o]of[[7.6,-.3],[10,-.17],[10,.17],[7.6,.3]])p.push((12+r*Math.cos((i+o)*s)).toFixed(2)+' '+(12+r*Math.sin((i+o)*s)).toFixed(2));return `<path d="M${p.join('L')}Z"/><circle cx="12" cy="12" r="3.2"/>`})(),back:'<path d="M15 5l-7 7 7 7"/>',dash:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z"/>',school:'<path d="M3 10l9-6 9 6M5 10v10h14V10M10 20v-5h4v5"/>',plan:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',bell:'<path d="M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5zM10 20h4"/>',grade:'<path d="M5 20V10M12 20V4M19 20v-7"/>',cards:'<path d="M8 8h11v11H8zM5 16V5h11"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" width="${k=='gear'||k=='back'?22:28}" height="${k=='gear'||k=='back'?22:28}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const FACH=['Deutsch','Mathe','Englisch','Französisch','Latein','Biologie','Chemie','Physik','Geschichte','Erdkunde','Sozialkunde','Religion','Ethik','Informatik','Musik','Kunst','Sonstiges'];

const STU=[5,6,7,8,9,10,11,12,13],COL=['#f26b1d','#1d1d1b','#8a8a85','#ffb27a','#4a4a47'];
/* Farben für Bücher: Regenbogen, dann Schwarz, Grau, Weiß, Braun */
const BCOL=['#e5484d','#f26b1d','#f5c518','#84cc16','#14b8a6','#3b82f6','#6366f1','#8b5cf6','#ec4899','#161616','#4a4a47','#8a8a85','#ffffff','#8b5e3c'];

/* ===== Version und Neuerungen: bei jedem Update VERSION erhöhen und oben einen Eintrag in CHANGELOG ergänzen ===== */
const VERSION='2026-11-18.1';
const CHANGELOG=[
 {v:'2026-11-18.1',t:'Vokabeln, Noten und viele Verbesserungen',items:['Neu: Vokabeln. Unter Lernmaterial legst du Karteikarten-Stapel an, übst sie und siehst am Ende jeder Runde, wie viele richtig waren. Stapel kannst du für andere freigeben.','Neu: Noten. Im Dashboard trägst du Noten oder MSS-Punkte in eine Tabelle ein und bekommst Statistiken zu Durchschnitt, Fächern, Verteilung und Verlauf.','Stundenplan: Jetzt mit 11 Stunden pro Tag. Der Farbkreis ist weg, damit sich Farben nicht mehr ändern. Ethik, Evangelisch und Katholisch sind hellblau.','Schulbücher, Stoff und Mitschriften: Das Bundesland muss nicht mehr gewählt werden.','Admin: Accounts können gelöscht werden.','Die Seite heißt jetzt STUDIQ.']},
 {v:'2026-11-17.3',t:'Benachrichtigungen und mehr Farben',items:['Neue Glocke oben rechts: Sie zeigt neue Nachrichten und Freundschaftsanfragen.','Hinweise im Browser kannst du unter Benachrichtigungen einschalten. Sie funktionieren, solange die Seite im Browser geöffnet ist.','Bücher, Stoff und Mitschriften haben jetzt 14 Farben vom Regenbogen bis Schwarz und Weiß, dazu eine eigene Farbe.','Dieses Fenster zeigt dir ab jetzt nach jedem Update, was neu ist.']},
 {v:'2026-11-17.2',t:'Schulen, Code und Nachrichten',items:['Jede Person hat einen 6-stelligen Code, mit dem man sie als Freund hinzufügen kann.','Du kannst deinen Freunden Nachrichten schreiben.','Schulen mit Schülerlisten. Nur der Admin legt Schulen an.','Profile mit Profilbild, Hintergrundbild, Stufe und Schule.']}
];
function showSplash(force){
 if(!force&&S.seenV==VERSION)return;
 document.querySelector('.splash')?.remove();
 const i=CHANGELOG.findIndex(c=>c.v==S.seenV),l=force||i<=0?CHANGELOG.slice(0,2):CHANGELOG.slice(0,i);
 const d=document.createElement('div');d.className='splash';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Willkommen bei STUDIQ');
 d.innerHTML=`<div class="card"><p class="m" style="margin:0">Version ${esc(VERSION)}</p><h1 style="margin-top:4px">Willkommen bei STUDIQ</h1><h2 style="font-size:17px;margin:14px 0 4px">Wofür ist STUDIQ da?</h2><p style="margin:0">STUDIQ ist deine Lernplattform für die Schule. Du findest Schulbücher und Lernmaterial online, teilst Mitschriften, übst Vokabeln mit Karteikarten, behältst deine Noten im Blick, führst deinen Stundenplan und bleibst mit Freunden und Mitschülern in Kontakt.</p><p style="margin:14px 0 0;padding:12px 14px;border-radius:14px;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))"><b>Noch nicht fertig.</b> Die Seite wird noch weiterentwickelt. Es kann Fehler geben, und einiges ändert sich noch.</p><h2 style="margin:22px 0 0">Was ist neu?</h2>${l.map(c=>`<h3 style="font:500 16px Inter,system-ui,sans-serif;margin:16px 0 4px">${esc(c.t)}</h3><ul style="padding-left:20px;margin:0">${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}<p style="margin:22px 0 0"><button class="btn o" id="spb">Alles klar</button></p></div>`;
 const close=()=>{sv('seenV',VERSION);d.remove()};
 document.body.append(d);$('#spb').onclick=close;d.onclick=e=>{if(e.target==d)close()};

schule:()=>{const s=SCH.find(x=>x.id==ME.school_id);return `<h1>${esc(s?s.name:'Meine Schule')}</h1><p class="m">Hier findest du Schulen, Chat und Mitschüler.</p>${s?`<button class="btn g" onclick="go('schulv',{s:'${s.id}'})">Schüler an ${esc(s.name)}</button>`:`<button class="btn g" onclick="go('schulen')">Schule auswählen</button>`}<div class="tiles" style="margin-top:20px">${tl([['school','Schulen','Alle Schulen ansehen','schulen'],['chat','Chat','Nachrichten an Freunde','chat'],['user','Schülerliste','Öffentliche Profile','schueler'],['user','Freunde','Per Name oder Code','freunde']])}</div>`},
schulen:()=>`<h1>Schulen</h1><p class="m">Tippe auf eine Schule, um ihre Schüler zu sehen.</p>${ME.role=='admin'?`<div class="card"><label style="margin-top:0">Neue Schule (nur Admin)</label><div class="bar" style="margin:0"><input id="sn" placeholder="z. B. IGS Anna Seghers" onkeydown="event.key=='Enter'&&addSchool()"><button class="btn o" onclick="addSchool()">Hinzufügen</button></div></div>`:''}<div class="card" style="padding:6px 24px">${SCH.length?SCH.map(s=>`<div class="row" style="cursor:pointer" onclick="go('schulv',{s:'${s.id}'})"><span>${esc(s.name)}<span class="m">, ${PROF.filter(p=>p.school_id==s.id&&p.visible!==false&&p.role!='gesperrt').length} Schüler</span></span>${ME.role=='admin'?`<button class="btn g" onclick="event.stopPropagation();delSchool('${s.id}')">Löschen</button>`:''}</div>`).join(''):`<p class="m">Noch keine Schulen.${ME.role=='admin'?'':' Der Admin legt sie an.'}</p>`}</div>`,
schulv:()=>{const s=SCH.find(x=>x.id==P.s),l=PROF.filter(p=>p.school_id==s.id&&(p.visible!==false||p.id==ME.id)&&p.role!='gesperrt');return `<h1>${esc(s.name)}</h1><p class="m">${l.length} Schüler${ME.school_id==s.id?'. Das ist deine Schule.':''}</p>${ME.school_id==s.id?'':`<button class="btn o" onclick="svp('school_id','${s.id}');render()">Das ist meine Schule</button>`}<div class="card" style="padding:6px 24px;max-width:none">${l.length?l.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p.id}'})">${pn(p)}${p.klasse?`<span class="m">, Klasse ${esc(p.klasse)}</span>`:''}</span>${p.id==ME.id?'<span class="m">Du</span>':`<button class="btn ${ql(p)?'g':'o'}" onclick="rq('${p.id}')">${ql(p)||'Anfrage senden'}</button>`}</div>`).join(''):'<p class="m">Hier ist noch niemand.</p>'}</div>`},
schueler:()=>{const l=PROF.filter(p=>p.visible!==false&&p.id!=ME.id&&p.role!='gesperrt');return `<h1>Schülerliste</h1><p class="m">${ME.visible===false?'Du bist privat und erscheinst hier nicht.':'Du erscheinst hier öffentlich. Das änderst du in den Einstellungen.'}</p><div class="card" style="padding:6px 24px;max-width:none">${l.length?l.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p.id}'})">${pn(p)}${schn(p.school_id)?`<span class="m">, ${esc(schn(p.school_id))}</span>`:''}</span><button class="btn ${ql(p)?'g':'o'}" onclick="rq('${p.id}')">${ql(p)||'Anfrage senden'}</button></div>`).join(''):'<p class="m">Noch niemand da.</p>'}</div>`},
freunde:()=>{const f=frs();return `<h1>Freunde</h1><p class="m">Füge Leute über ihren Namen oder ihren 6-stelligen Code hinzu. Sie müssen nicht in der Schülerliste stehen.</p><div class="card"><p class="m" style="margin:0">Dein Code</p><h1 style="margin:2px 0 0;letter-spacing:.06em">${fmt(ME.code)}</h1><label>Name oder Code der Person</label><div class="bar" style="margin:0"><input id="fn" autocapitalize="none" placeholder="Name oder 000 000" onkeydown="event.key=='Enter'&&fadd()"><button class="btn o" onclick="fadd()">Anfrage senden</button></div></div>${ME.accept_requests===false?'<p class="m">Du erhältst gerade keine Anfragen. Das änderst du in den Einstellungen.</p>':f.inc.length?`<h2>Anfragen an dich</h2><div class="card" style="padding:6px 24px;max-width:none">${f.inc.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p}'})">${pn(byId(p))}</span><button class="btn o" onclick="facc('${p}')">Annehmen</button></div>`).join('')}</div>`:''}<h2>Deine Freunde</h2><div class="card" style="padding:6px 24px;max-width:none">${f.friends.length?f.friends.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p}'})">${pn(byId(p))}</span><button class="btn o" onclick="go('chat',{u:'${p}'})">Nachricht</button></div>`).join(''):'<p class="m">Noch keine Freunde.</p>'}</div>${f.sent.length?`<h2>Gesendet</h2><div class="card" style="padding:6px 24px;max-width:none">${f.sent.map(p=>`<div class="row"><span>${pn(byId(p))}</span><span class="m">Angefragt</span></div>`).join('')}</div>`:''}`},
plan:()=>{const t=(new Date().getDay()+6)%7,pl=PL.plan;return `<h1>Stundenplan</h1><p class="m">Tippe in ein Feld und trag dein Fach ein. Es wird automatisch in deinem Account gespeichert.</p><div class="plan"><span></span>${DAYS.map((d,i)=>`<b class="${i==t?'today':''}">${d}</b>`).join('')}${Array.from({length:ROWS},(_,r)=>`<span class="hr">${r+1}</span>${DAYS.map((_,c)=>`<div class="pc"><input class="${pl[c+'-'+r]?'f':''}" style="${cst(c+'-'+r,pl[c+'-'+r]||'')}" data-c="${cst(c+'-'+r,pl[c+'-'+r]||'')}" aria-label="${DAYS[c]}, ${r+1}. Stunde" value="${esc(pl[c+'-'+r]||'')}" oninput="ps('${c}-${r}',this)"></div>`).join('')}`).join('')}</div>`},
profil:()=>{const m=DB.filter(x=>x.by==ME.id);return phead(ME)+`<p class="m" style="text-align:center;margin-top:6px">${info(ME,1)}</p><p style="text-align:center">Dein Code: <b>${fmt(ME.code)}</b> <span class="m">(zum Hinzufügen als Freund)</span></p><div class="card" style="padding:18px 24px"><p class="m" style="margin:0 0 12px">Profilbild</p><div class="chips" style="gap:12px;align-items:center">${AVATARS.map((a,i)=>`<img class="avc ${!ME.avu&&(ME.avatar_idx||0)==i?'on':''}" src="${a}" alt="Standardbild ${i+1}" onclick="pickAv(${i})">`).join('')}<label class="btn g" style="margin:0;font-size:15px">Eigenes Bild<input type="file" accept="image/*" hidden onchange="imgUp(this,'avatar')"></label>${ME.avatar_path?`<button class="btn g" onclick="rmImg('avatar')">Entfernen</button>`:''}</div><p class="m" style="margin:20px 0 12px">Hintergrundbild</p><div class="chips" style="gap:12px;align-items:center"><label class="btn g" style="margin:0;font-size:15px">Bild wählen<input type="file" accept="image/*" hidden onchange="imgUp(this,'banner')"></label>${ME.banner_path?`<button class="btn g" onclick="rmImg('banner')">Entfernen</button>`:''}</div></div><div class="card" style="padding:6px 24px">${SP.PF()}</div><h2>Meine Uploads</h2><div class="grid">${m.map(card).join('')||'<p class="m">Noch nichts hochgeladen.</p>'}</div>`},
person:()=>{const p=byId(P.u),me=p.id==ME.id,s=me?'':ql(p);return phead(p)+`<p class="m" style="text-align:center;margin-top:6px">${info(p,me)||'Noch keine Angaben.'}</p>${me?`<p style="text-align:center"><button class="btn g" onclick="go('profil')">Mein Profil bearbeiten</button></p>`:`<p style="text-align:center">${s=='Befreundet'?`<button class="btn o" onclick="go('chat',{u:'${p.id}'})">Nachricht schreiben</button>`:s=='Anfrage offen'?`<button class="btn o" onclick="facc('${p.id}')">Anfrage annehmen</button>`:s=='Angefragt'?'<span class="m">Anfrage gesendet</span>':`<button class="btn o" onclick="rq('${p.id}')">Anfrage senden</button>`}</p>`}<p class="m" style="text-align:center">Code: ${fmt(p.code)}</p>`},
sec:()=>{const t=P.t,f=F[t],T=TY[t];
if(!f.go)return `<h1>${T.n}</h1><p class="m">${T.s}. Wähle zuerst deine Klasse.</p><div class="card"><label>Klasse</label><div class="chips">${STU.map(s=>`<span class="chip ${f.stufe==s?'on':''}" onclick="fp('stufe',${s})">${s}</span>`).join('')}</div><p style="margin:22px 0 0"><button class="btn o" onclick="fgo()">Ergebnisse anzeigen</button></p></div>`;
return `<h1>${T.n}</h1><div class="bar">${t!='all'?`<span class="chip on" onclick="F['${t}'].go=0;render()">Klasse ${f.stufe}, ändern</span>`:''}<input placeholder="Suchen, zum Beispiel Deutsch" aria-label="Suche" value="${esc(f.q)}" oninput="F['${t}'].q=this.value;$('#gr').innerHTML=gr()">${t!='all'&&can(t)?`<button class="btn o" onclick="nw('${t}')">${T.one}</button>`:''}</div><div class="grid" id="gr">${gr()}</div>`},
neu:()=>`<h1>${TY[cur.type].one}</h1><p class="m">Lege zuerst den Ordner an. Die Seiten lädst du im nächsten Schritt hoch.</p><div class="card"><label>Titel</label><input placeholder="Zum Beispiel Deutsch 7" oninput="u('title',this.value)" value="${esc(cur.title)}"><label>Fach</label>${sel('fach',FACH)}<label>Klasse</label>${sel('stufe',STU)}<p style="margin:22px 0 0"><button class="btn o" onclick="mkd()">Weiter</button></p></div>`,
edit:()=>`<h1>${TY[cur.type].one} einrichten</h1><div class="ed"><div><div id="pv"></div><label>Cover (optional)</label><input type="file" accept="image/*" onchange="cov(this)"></div><div><label style="margin-top:0">Titel</label><input value="${esc(cur.title)}" oninput="u('title',this.value)"><label>Beschreibung (optional)</label><textarea rows="3" oninput="u('desc',this.value)">${esc(cur.desc)}</textarea><label>Farbe</label><div class="sw">${BCOL.map(c=>`<i class="${c==cur.color?'on':''}" style="background:${c}" onclick="u('color','${c}');this.parentNode.querySelectorAll('i').forEach(i=>i.classList.toggle('on',i==this))"></i>`).join('')}<input type="color" aria-label="Eigene Farbe" title="Eigene Farbe" value="${/^#[0-9a-f]{6}$/i.test(cur.color)?cur.color:'#f26b1d'}" style="width:30px;height:30px;padding:0;border:2px solid var(--bg);border-radius:50%;cursor:pointer;flex:none;background:none" oninput="u('color',this.value);this.parentNode.querySelectorAll('i').forEach(i=>i.classList.remove('on'))"></div><label>Fach</label>${sel('fach',FACH)}<label>Klasse</label>${sel('stufe',STU)}<label>Schule (optional)</label><input value="${esc(cur.school)}" oninput="u('school',this.value)"></div></div><h2>Seiten hochladen</h2><p class="m" style="margin:-4px 0 12px">Jede Seite wird sofort dauerhaft gespeichert.</p><label class="drop">Bilder oder PDFs auswählen, auch GoodNotes-Exporte<input type="file" multiple hidden accept="image/*,application/pdf" onchange="up(this)"></label><div class="thumbs" id="th"></div><button class="btn o" onclick="fin()">Fertig</button> <button class="btn g" style="margin-left:10px" onclick="del()">Ordner löschen</button>`,
view:()=>`<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(cur.title)}</h1>${cur.pages.length?`<button class="btn g" onclick="dl(0)">Seite als PDF</button><button class="btn g" onclick="dl(1)">Alles als PDF</button>`:''}${canEdit(cur)?`<button class="btn g" onclick="go('edit',{id:'${cur.id}'})">Bearbeiten</button>`:''}</div><p class="m">${cur.fach}, Klasse ${cur.stufe}${cur.desc?'. '+esc(cur.desc):''}</p>${cur.pages.length?`<div class="stage"><button class="ib" aria-label="Zurückblättern" onclick="show(-1)">${ic('back')}</button><div class="book" id="bk"></div><button class="ib nx" aria-label="Weiterblättern" onclick="show(1)">${ic('back')}</button></div><div class="pn" id="pn"></div>`:`<div class="card"><p class="m" style="margin-top:0">Noch keine Seiten.</p>${canEdit(cur)?`<button class="btn o" onclick="go('edit',{id:'${cur.id}'})">Seiten hochladen</button>`:''}</div>`}`,
vokab:()=>{const mine=DK.filter(d=>d.owner==ME.id);return `<h1>Vokabeln</h1><p class="m">Erstelle Karteikarten-Stapel und übe sie. Am Ende jeder Runde siehst du deine Statistik. Stapel von anderen kannst du auch üben.</p><div class="card" style="max-width:none"><label style="margin-top:0">Neuer Stapel</label><div class="bar" style="margin:0"><input id="dn" maxlength="80" placeholder="Name, zum Beispiel Französisch Unit 3" onkeydown="event.key=='Enter'&&newDeck()"><button class="btn o" onclick="newDeck()">Anlegen</button></div></div><h2>Meine Stapel</h2><div class="grid">${mine.map(dcard).join('')||'<p class="m">Noch keine eigenen Stapel.</p>'}</div><h2>Stapel von anderen</h2><div class="bar" style="margin-top:0"><input placeholder="Suchen, zum Beispiel Latein" aria-label="Stapel suchen" value="${esc(DQ)}" oninput="DQ=this.value;$('#dg').innerHTML=dgr()"></div><div class="grid" id="dg">${dgr()}</div>`},
deck:()=>{
 const d=DK.find(x=>x.id==P.d),c=DKc[d.id],own=d.owner==ME.id||ME.role=='admin',rs=DKr[d.id]||[],rdy=c.filter(x=>x.front.trim()&&x.back.trim()).length;
 return `<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(d.title)}</h1><span class="chip ${REV?'on':''}" onclick="REV=!REV;render()">Rückseite zuerst</span><button class="btn o" onclick="startLearn('${d.id}')">Üben</button>${own?`<button class="btn g" onclick="delDeck('${d.id}')">Stapel löschen</button>`:''}</div><p class="m">${[d.fach,d.stufe&&'Klasse '+d.stufe,rdy+' Karten',d.owner!=ME.id&&'von '+dn(byId(d.owner))].filter(Boolean).map(esc).join(', ')}</p>${own?`<div class="card" style="max-width:none"><label style="margin-top:0">Titel</label><input maxlength="80" value="${esc(d.title)}" oninput="dset('title',this.value)"><label>Fach (optional)</label><select onchange="dset('fach',this.value||null)"><option value="">–</option>${FACH.map(f=>`<option ${f==d.fach?'selected':''}>${f}</option>`).join('')}</select><label>Klasse (optional)</label><select onchange="dset('stufe',this.value?+this.value:null)"><option value="">–</option>${STU.map(s=>`<option ${s==d.stufe?'selected':''}>${s}</option>`).join('')}</select><div class="row" style="margin-top:8px"><span>Andere dürfen diesen Stapel üben</span><input type="checkbox" ${d.shared?'checked':''} onchange="dset('shared',this.checked)"></div></div><h2>Karteikarten</h2><p class="m" style="margin:-4px 0 8px">Links steht die Vorderseite, rechts die Rückseite mit der Lösung. Alles wird automatisch gespeichert.</p><div id="cl">${c.map(crow).join('')}</div><div class="bar"><button class="btn g" onclick="addCard()">Karte hinzufügen</button><button class="btn g" onclick="$('#bulk').hidden=!$('#bulk').hidden">Aus Text einfügen</button></div><div class="card" id="bulk" hidden style="max-width:none"><p class="m" style="margin:0 0 8px">Eine Karte pro Zeile: Vorderseite ; Rückseite. Zum Beispiel: la maison ; das Haus</p><textarea id="bt" rows="6"></textarea><p style="margin:14px 0 0"><button class="btn o" onclick="bulkAdd()">Karten hinzufügen</button></p></div>`:`<div class="card" style="max-width:none"><p class="m" style="margin:0">Dieser Stapel gehört ${esc(dn(byId(d.owner)))}. Du kannst ihn üben, aber nicht ändern.</p></div>`}${rs.length?`<h2>Deine letzten Runden</h2><div class="card" style="padding:6px 24px;max-width:none">${rs.map(r=>`<div class="row"><span class="m">${fdt(r.created_at)}</span><span>${r.correct} von ${r.total} richtig</span><b>${r.total?Math.round(r.correct/r.total*100):0} %</b></div>`).join('')}</div>`:''}`
},
learn:()=>{
 const d=DK.find(x=>x.id==P.d),n=L.q.length;
 if(L.i>=n){
  const ok=L.ok.length,pct=Math.round(ok/n*100);
  return `<h1>Runde geschafft</h1><p class="m">${esc(d.title)}</p><div class="card" style="max-width:none;text-align:center"><div class="big">${ok} von ${n}</div><p class="m" style="margin:0">${pct} % richtig</p><div class="prog" style="margin:18px 0 0"><i style="width:${pct}%"></i></div></div><div class="stat"><div><b>${ok}</b><span>richtig</span></div><div><b>${L.bad.length}</b><span>falsch</span></div><div><b>${pct} %</b><span>Quote</span></div></div>${L.bad.length?`<h2>Das war noch falsch</h2><div class="card" style="padding:6px 24px;max-width:none">${L.bad.map(c=>`<div class="row"><span>${esc(c.front)}</span><span class="m">${esc(c.back)}</span></div>`).join('')}</div>`:'<p>Alles richtig. Stark!</p>'}<p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn o" onclick="startLearn('${d.id}')">Neue Runde</button>${L.bad.length?`<button class="btn g" onclick="startLearn('${d.id}',L.bad.map(c=>c.id))">Falsche nochmal</button>`:''}<button class="btn g" onclick="bk()">Zurück zum Stapel</button></p>`
 }
 const c=L.q[L.i],txt=L.flip!=L.rev?c.back:c.front,lab=L.flip!=L.rev?'Rückseite':'Vorderseite';
 return `<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(d.title)}</h1><span class="m">${L.i+1} von ${n}</span></div><div class="prog" style="margin:12px 0 18px"><i style="width:${L.i/n*100}%"></i></div><div class="fc ${L.flip?'bk2':''}" onclick="flipC()" role="button" tabindex="0" aria-label="Karte umdrehen"><div><small>${lab}</small>${esc(txt)}</div></div><p style="text-align:center;margin:20px 0 0">${L.flip?`<button class="btn g" onclick="ansC(0)">Falsch</button> <button class="btn o" onclick="ansC(1)">Richtig</button>`:`<button class="btn o" onclick="flipC()">Umdrehen</button>`}</p><p class="m" style="text-align:center;font-size:13px">Tastatur: Leertaste dreht um, Pfeil rechts heißt richtig, Pfeil links heißt falsch.</p>`
},
noten:()=>{
 const note=GM=='note',gl=GR.filter(g=>g.system==GM),vals=gl.map(g=>g.value),n=vals.length,a=mean(vals),
  best=n?(note?Math.min(...vals):Math.max(...vals)):0,worst=n?(note?Math.max(...vals):Math.min(...vals)):0;
 const m=new Map();gl.forEach(g=>{const k=g.fach.trim().toLowerCase();if(!m.has(k))m.set(k,{f:g.fach.trim(),v:[]});m.get(k).v.push(g.value)});
 const subs=[...m.values()].map(s=>({f:s.f,a:mean(s.v)})).sort((x,y)=>note?x.a-y.a:y.a-x.a);
 const keys=note?[1,2,3,4,5,6]:Array.from({length:16},(_,i)=>i),cnt=keys.map(k=>vals.filter(v=>note?Math.min(6,Math.max(1,Math.round(v)))==k:v==k).length),mx=Math.max(1,...cnt);
 const asc=gl.slice().reverse();
 return `<h1>Noten</h1><p class="m">Trag deine Noten oder MSS-Punkte ein und sieh dir die Statistik dazu an. Nur du siehst deine Einträge.</p><div class="card" style="max-width:none"><div class="seg" role="group" aria-label="Notensystem"><button class="${note?'on':''}" onclick="GM='note';render()">Noten (1 bis 6)</button><button class="${note?'':'on'}" onclick="GM='punkte';render()">MSS-Punkte (0 bis 15)</button></div><form class="gf" onsubmit="addGrade();return false"><div><label style="margin-top:0">Fach</label><input id="gf" list="fl" maxlength="40" placeholder="z. B. Mathe" required></div><div><label style="margin-top:0">Bezeichnung (optional)</label><input id="gt" maxlength="60" placeholder="z. B. Klassenarbeit 2"></div><div><label style="margin-top:0">${note?'Note':'Punkte'}</label><input id="gv" type="number" inputmode="decimal" step="${note?'0.1':'1'}" min="${note?1:0}" max="${note?6:15}" required></div><div><label style="margin-top:0">Datum</label><input id="gd" type="date" value="${todayStr()}"></div><button class="btn o" type="submit">Hinzufügen</button></form><datalist id="fl">${FACH.map(f=>`<option value="${f}">`).join('')}</datalist></div><h2>Einträge</h2><div class="card" style="padding:6px 16px;max-width:none">${n?`<table class="tbl"><thead><tr><th>Datum</th><th>Fach</th><th>${note?'Note':'Punkte'}</th><th></th></tr></thead><tbody>${gl.map(g=>`<tr><td>${fd(g.given_on)}</td><td>${esc(g.fach)}${g.title?`<br><span class="m" style="font-size:13px">${esc(g.title)}</span>`:''}</td><td><b>${fn(g.value)}</b></td><td style="text-align:right"><button class="ib" style="display:inline-flex" aria-label="Eintrag löschen" onclick="delGrade('${g.id}')">×</button></td></tr>`).join('')}</tbody></table>`:'<p class="m">Noch keine Einträge.</p>'}</div>${n?`<h2>Statistik</h2><div class="stat"><div><b>${fn(a)}</b><span>Durchschnitt${note?'':' (ca. Note '+fn(Math.max(1,(17-a)/3),1)+')'}</span></div><div><b>${fn(best)}</b><span>Bester Wert</span></div><div><b>${fn(worst)}</b><span>Schlechtester Wert</span></div><div><b>${n}</b><span>Einträge</span></div></div><div class="card" style="max-width:none"><b>Nach Fach</b>${subs.map(s=>`<div class="hbar"><span title="${esc(s.f)}">${esc(s.f)}</span><div class="prog"><i style="width:${Math.max(4,note?(6-s.a)/5*100:s.a/15*100)}%"></i></div><em>${fn(s.a)}</em></div>`).join('')}<p class="m" style="font-size:13px;margin:8px 0 0">Längerer Balken heißt besser.</p></div><div class="card" style="max-width:none"><b>${note?'Notenverteilung (gerundet)':'Verteilung der Punkte'}</b><div class="hist">${keys.map((k,i)=>`<div><span>${cnt[i]||''}</span><i style="height:${Math.round(cnt[i]/mx*90)}px"></i><em>${k}</em></div>`).join('')}</div></div><div class="card" style="max-width:none"><b>Verlauf</b>${n>1?`${gchart(asc)}<p class="m" style="font-size:13px;margin:8px 0 0">Die Linie ist dein Durchschnitt über die Zeit, die Kreise sind einzelne Werte. Oben ist besser.</p>`:'<p class="m">Ab zwei Einträgen siehst du hier den Verlauf.</p>'}</div>`:''}`
},
notif:()=>{const f=frs(),ids=Object.keys(UNR),perm='Notification' in window?Notification.permission:'';return `<h1>Benachrichtigungen</h1>${f.inc.length?`<h2>Freundschaftsanfragen</h2><div class="card" style="padding:6px 24px;max-width:none">${f.inc.map(p=>`<div class="row"><span style="cursor:pointer" onclick="go('person',{u:'${p}'})">${pn(byId(p))}</span><button class="btn o" onclick="facc('${p}')">Annehmen</button></div>`).join('')}</div>`:''}${ids.length?`<h2>Neue Nachrichten</h2><div class="card" style="padding:6px 24px;max-width:none">${ids.map(id=>{const m=NMSG.find(x=>x.sender==id);return `<div class="row"><span>${pn(byId(id))}<span class="m">, ${UNR[id]} neu</span><br><span class="m">${esc(String(m?m.body:'').slice(0,60))}</span></span><button class="btn o" onclick="go('chat',{u:'${id}'})">Öffnen</button></div>`}).join('')}</div>`:''}${f.inc.length||ids.length?'':'<p class="m">Nichts Neues.</p>'}${perm?`<div class="card" style="max-width:none"><b>Hinweise im Browser</b><p class="m" style="margin:6px 0 12px">${perm=='granted'?'Sie sind eingeschaltet. Du bekommst einen Hinweis, wenn die Seite im Hintergrund offen ist und etwas Neues kommt.':perm=='denied'?'Dein Browser blockiert sie gerade. Erlaube Hinweise für diese Seite in den Browser-Einstellungen.':'Bekomme einen Hinweis, wenn die Seite im Hintergrund offen ist und etwas Neues kommt. Bei geschlossener Seite gibt es keine Hinweise.'}</p>${perm=='default'?'<button class="btn o" onclick="askNotif()">Hinweise einschalten</button>':''}</div>`:''}`},
chat:()=>{const f=frs().friends;if(P.u&&f.includes(P.u)){const p=byId(P.u);return `<div class="bar" style="margin:8px 0"><h1 style="flex:1;margin:0">${esc(dn(p))}</h1><button class="btn g" onclick="go('person',{u:'${p.id}'})">Profil</button></div><div class="card" id="ms"></div><div class="bar"><input id="mi" placeholder="Nachricht schreiben" maxlength="2000" onkeydown="event.key=='Enter'&&snd()"><button class="btn o" onclick="snd()">Senden</button></div>`}return `<h1>Chat</h1><p class="m">Du kannst Freunden schreiben. Freunde fügst du über Name oder Code hinzu.</p><div class="card" style="padding:6px 24px;max-width:none">${f.length?f.map(id=>`<div class="row"><span>${pn(byId(id))}</span><button class="btn o" onclick="go('chat',{u:'${id}'})">Schreiben</button></div>`).join(''):'<p class="m">Noch keine Freunde.</p>'}</div><p><button class="btn g" onclick="go('freunde')">Freunde hinzufügen</button></p>`},
set:()=>`<h1>Einstellungen</h1><div class="tabs">${['Konto','Darstellung','Privatsphäre'].map(t=>`<button class="tab ${t==st?'on':''}" onclick="st='${t}';render()">${t}</button>`).join('')}</div><div class="card" style="padding:6px 24px;margin-top:16px">${SP[st]()}</div>`};
const SP={
Konto:()=>`<div class="row"><span>Angemeldet als <b>${esc(ME.username)}</b> (${ROLEN[ME.role]})</span><button class="btn g" onclick="out()">Abmelden</button></div><div class="row"><span>Profil mit Schule, Klasse und Stufe</span><button class="btn g" onclick="go('profil')">Bearbeiten</button></div><div class="row"><input id="np" type="password" placeholder="Neues Passwort" autocomplete="new-password" style="max-width:220px"><button class="btn g" onclick="npw()">Passwort ändern</button></div><div class="row"><span>Was ist neu?</span><button class="btn g" onclick="showSplash(1)">Ansehen</button></div>`,
PF:()=>`<div class="row"><span>Anzeigename</span><input style="max-width:220px" placeholder="${esc(ME.username)}" value="${esc(ME.display_name||'')}" oninput="svp('display_name',this.value.trim()||null)"></div><div class="row"><span>Benutzername</span><b>@${esc(ME.username)}</b></div><div class="row"><span>Schule</span><select style="max-width:220px" onchange="svp('school_id',this.value||null)"><option value="">–</option>${SCH.map(s=>`<option value="${s.id}" ${s.id==ME.school_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="row"><span>Klasse</span><input style="max-width:120px" placeholder="z. B. 7a" value="${esc(ME.klasse||'')}" oninput="svp('klasse',this.value)"></div><div class="row"><span>Stufe</span><select style="max-width:120px" onchange="svp('stufe',this.value?+this.value:null)"><option value="">–</option>${STU.map(v=>`<option ${v==ME.stufe?'selected':''}>${v}</option>`).join('')}</select></div>`,
Darstellung:()=>`<div class="row"><span>Darkmode</span><input type="checkbox" ${isDark()?'checked':''} onchange="sv('dark',this.checked)"></div>`,
Privatsphäre:()=>`<div class="row"><span>In der Schülerliste sichtbar</span><div class="chips">${[['Öffentlich',true],['Privat',false]].map(([l,v])=>`<span class="chip ${(ME.visible!==false)==v?'on':''}" onclick="svp('visible',${v});render()">${l}</span>`).join('')}</div></div><div class="row"><span>Freundschaftsanfragen erhalten</span><input type="checkbox" ${ME.accept_requests!==false?'checked':''} onchange="svp('accept_requests',this.checked)"></div>`};
theme();render();boot();document.addEventListener('touchstart',()=>{},{passive:true});
</script></body></html>
